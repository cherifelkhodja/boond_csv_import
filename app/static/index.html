<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoondManager CSV Importer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>BoondManager CSV Importer</h1>
            <button id="testConnectionBtn" class="btn btn-secondary">Tester la connexion</button>
        </div>
        <div id="connectionStatus" class="connection-status hidden"></div>
    </header>

    <nav>
        <ul class="tabs">
            <li><a href="#" class="tab-link active" data-entity="projects">Projects</a></li>
            <li><a href="#" class="tab-link" data-entity="deliveries">Deliveries</a></li>
        </ul>
    </nav>

    <main>
        <div class="tab-content active" id="tab-projects">
            <!-- Content generated by JS -->
        </div>
        <div class="tab-content" id="tab-deliveries">
        </div>
    </main>

    <template id="entity-template">
        <div class="entity-container">
            <!-- Template Section -->
            <section class="section template-section">
                <h2>Template CSV</h2>
                <div class="template-info">
                    <p>Champs requis : <span class="required-fields"></span></p>
                    <button class="btn btn-primary download-template-btn">Telecharger le template CSV</button>
                </div>
                <div class="entity-notes hidden">
                    <ul class="notes-list"></ul>
                </div>
            </section>

            <!-- Upload Section -->
            <section class="section upload-section">
                <h2>Upload CSV</h2>
                <div class="dropzone" tabindex="0">
                    <div class="dropzone-content">
                        <svg class="dropzone-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p>Glissez-deposez votre fichier CSV ici</p>
                        <p class="dropzone-or">ou</p>
                        <button class="btn btn-secondary browse-btn">Parcourir</button>
                    </div>
                    <input type="file" class="file-input" accept=".csv" hidden>
                </div>
                <div class="selected-file hidden">
                    <span class="file-name"></span>
                    <button class="btn btn-text clear-file-btn">X</button>
                </div>
            </section>

            <!-- Preview Section -->
            <section class="section preview-section hidden">
                <h2>Previsualisation</h2>
                <div class="preview-actions">
                    <button class="btn btn-secondary add-row-btn">+ Ajouter une ligne</button>
                </div>
                <div class="table-container">
                    <table class="preview-table">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <!-- Actions Section -->
            <section class="section actions-section hidden">
                <div class="action-buttons">
                    <button class="btn btn-secondary validate-btn">Valider</button>
                    <button class="btn btn-primary import-btn">Importer</button>
                </div>
                <div class="progress-container hidden">
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <span class="progress-text">0%</span>
                </div>
            </section>

            <!-- Results Section -->
            <section class="section results-section hidden">
                <h2>Resultats</h2>
                <div class="results-summary">
                    <span class="success-count"></span>
                    <span class="failed-count"></span>
                </div>
                <div class="table-container">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Ligne</th>
                                <th>Statut</th>
                                <th>ID Boond</th>
                                <th>Message</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <button class="btn btn-secondary export-results-btn">Exporter les resultats</button>
            </section>

            <!-- Validation Errors -->
            <div class="validation-errors hidden">
                <h3>Erreurs de validation</h3>
                <ul class="error-list"></ul>
            </div>
        </div>
    </template>

    <script src="/static/app.js"></script>
</body>
</html>
